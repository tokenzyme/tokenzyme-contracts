name: Feature request
description: Propose a change to the protocol, the tests or the tooling
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Changes to protocol mechanics — curve math, fees, migration — should start here
        rather than as a pull request, so the design can be discussed first.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the limitation you are hitting, not just the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Does this change the on-chain interface?
      description: Event signatures, function signatures and storage layout ripple out to the indexer, the API and both clients.
      options:
        - 'No — internal or tooling only'
        - 'Yes — changes events or function signatures'
        - 'Yes — changes storage layout'
        - Not sure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
