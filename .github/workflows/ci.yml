name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Compile, lint and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Corepack must be enabled BEFORE setup-node: the `cache: yarn` option shells
      # out to `yarn cache dir` inside that step, and the runner's global Yarn 1
      # refuses to run for a project declaring packageManager: yarn@4.
      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      # TEST=true also compiles test/contracts/*.sol — see `dependencyCompiler` in
      # hardhat.config.ts. The suite imports TypeChain types for those contracts, so
      # without it the Lint step below cannot resolve them and fails with hundreds of
      # cascading `error`-typed-value errors.
      - name: Compile contracts
        run: TEST=true yarn hardhat compile

      - name: Lint
        run: yarn lint

      - name: Check formatting
        run: yarn prettier --check './**/*.{ts,cts,mts,js,cjs,mjs,json,yml,yaml}'

      - name: Test
        run: yarn test

      - name: Check contract sizes
        run: yarn contracts:size
